<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文勇者大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 夜空下的奇幻冒險：深藍底、金色＝金幣與獎勵、紅＝生命、紫＝經驗。單一深色主題。 */
  --bg:#11152a; --panel:#1b2140; --panel2:#262e55; --line:#3a4474;
  --ink:#f6f1e3; --muted:#a9b1cf;
  --gold:#ffd35a; --accent:#7cc8ff; --hp:#ff5f78; --xp:#a58cff; --ok:#5fe0a0; --bad:#ff8a8a;
  --display:'Pixelify Sans','Noto Sans TC',system-ui,sans-serif;
  --body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(circle at 10% 0%,#25336a 0,transparent 45%),radial-gradient(circle at 95% 100%,#2d2056 0,transparent 45%);background-attachment:fixed}
#app{max-width:760px;margin:0 auto;padding:14px 16px 96px;display:grid;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 14px;transition:transform .08s,background .15s,border-color .15s}
button:hover{background:#323c6e}
button:active{transform:translateY(2px)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-main{background:var(--gold);color:#2a1d00;border-color:#ffeab0;font-weight:900}
.btn-main:hover{background:#ffe07f}
.btn-ghost{background:transparent}
.wide{width:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:24px;color:var(--gold)} h3{font-size:19px}
.title{font-size:40px;color:var(--gold);text-shadow:0 4px 0 #7a4c00;text-align:center}
.sub{text-align:center;color:var(--muted);margin:6px 0 0}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}.center{justify-content:center}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--muted)}.small{font-size:14px}.gold{color:var(--gold)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.en{font-family:var(--body);letter-spacing:.2px}
.tag{font-size:13px;background:#0e1226;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--accent);white-space:nowrap}
.bar{height:12px;background:#0a0d1c;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:7px;transition:width .4s}
.bar.xp>i{background:linear-gradient(90deg,#7b6cff,var(--xp))}
.bar.hp>i{background:linear-gradient(90deg,#e8435f,var(--hp))}
.bar.gd>i{background:linear-gradient(90deg,#e0a92a,var(--gold))}
.ava{font-size:42px;line-height:1;width:60px;height:60px;display:grid;place-items:center;background:#0e1226;border:2px solid var(--line);border-radius:14px;flex:none}
.ava.sm{font-size:28px;width:44px;height:44px;border-radius:10px}
.coins{font-size:22px;color:var(--gold);white-space:nowrap}
/* HUD + nav */
.hud{display:flex;gap:12px;align-items:center;position:sticky;top:8px;z-index:5;box-shadow:0 8px 24px #0008}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0e1226ee;border-top:2px solid var(--line);z-index:10;backdrop-filter:blur(6px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;font-size:12px;border-color:transparent;background:transparent}
.nav button .ic{font-size:24px;line-height:1.2}
.nav button[aria-current="page"]{background:var(--panel2);border-color:var(--gold);color:var(--gold)}
/* map */
.mapwrap{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--line);max-width:540px;width:100%;margin:0 auto}
.mapwrap svg{display:block;width:100%;height:auto}
.cloud{position:absolute;left:0;font-size:46px;opacity:.28;pointer-events:none;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(600px)}}
.nd{cursor:pointer}
.nd:hover .main{filter:brightness(1.25)}
.nd.lk{cursor:not-allowed}
.nlabel{font:700 14px var(--body);fill:#fff;stroke:#0b0e1d;stroke-width:4px;paint-order:stroke}
.nnum{font:700 18px var(--display);fill:#1b1300}
.pulse{fill:none;stroke:#ffe39a;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.6);opacity:0}}
.bob{animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.banner-t{font:700 15px var(--body);fill:#10131f}
/* overlay sheet */
#overlay{position:fixed;inset:0;display:none;z-index:30}
#overlay.on{display:block}
.sheet-bg{position:absolute;inset:0;background:#05071299}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);max-height:90%;overflow:auto;background:var(--panel);border-top:4px solid var(--rc,var(--gold));border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;animation:sheetUp .28s ease-out}
@keyframes sheetUp{from{transform:translate(-50%,40px);opacity:0}}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92%);background:var(--panel);border:3px solid var(--gold);border-radius:22px;padding:22px;text-align:center;display:grid;gap:10px}
.rulebox{background:#0e1226;border-left:5px solid var(--rc,var(--gold));border-radius:10px;padding:12px 14px;line-height:1.7}
.exl{display:grid;gap:6px}
.exl .item{padding:8px 12px}
/* battle */
.btop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.bt-title{font-weight:700;text-align:center;flex:1;min-width:0;font-size:15px}
.arena{position:relative;height:280px;border-radius:18px;overflow:hidden;border:2px solid var(--rc);background:linear-gradient(180deg,var(--b2),var(--b1))}
.arena .deco{position:absolute;font-size:30px;opacity:.55;pointer-events:none}
.ground{position:absolute;left:-10%;right:-10%;bottom:-40px;height:110px;border-radius:50%;background:#0006}
.mon-info{position:absolute;top:10px;right:10px;width:46%;text-align:right;font-size:14px}
.hero-info{position:absolute;top:10px;left:10px;width:42%;font-size:14px}
.mon-info .bar,.hero-info .bar{margin:3px 0}
.mon{position:absolute;right:13%;top:74px;font-size:88px;line-height:1}
.mon.boss{font-size:112px;top:74px;right:9%;filter:drop-shadow(0 0 18px var(--rc))}
.mon .idle{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.hero-box{position:absolute;left:7%;bottom:18px;display:flex;align-items:flex-end;gap:2px}
.hero-sp{font-size:66px;line-height:1}
.pet-sp{font-size:42px;line-height:1;order:2}
.st1{filter:drop-shadow(0 0 8px #7cc8ffaa)} .st2{filter:drop-shadow(0 0 14px #ffd35add)}
.lunge{animation:lunge .4s ease-out}
@keyframes lunge{18%{transform:translate(-12px,5px) scale(.94,1.04) rotate(-6deg)}45%{transform:translate(78px,-34px) rotate(10deg) scale(1.1,.94)}70%{transform:translate(70px,-30px) rotate(6deg)}}
.cast{animation:cast .4s ease-out}
@keyframes cast{25%{transform:translate(-8px,3px) scale(.95,1.05)}50%{transform:translate(10px,-6px) scale(1.06,.96)}}
.phop{animation:phop .45s ease-out}
@keyframes phop{40%{transform:translate(80px,-60px) rotate(-14deg) scale(1.15)}}
.hurt{animation:hurt .5s}
@keyframes hurt{12%{transform:translateX(-26px) rotate(-8deg);filter:brightness(0) invert(1)}20%{filter:brightness(2.2) hue-rotate(-40deg)}40%{transform:translateX(-14px) rotate(-4deg)}60%{transform:translateX(4px)}}
.mhit{animation:mhit .45s}
@keyframes mhit{20%{transform:translateX(16px) rotate(8deg);filter:brightness(2.4)}60%{transform:translateX(-8px) rotate(-4deg)}}
.matk{animation:matk .5s ease-in-out}
@keyframes matk{28%{transform:translate(16px,-10px) scale(1.08,.94);filter:brightness(1.4) drop-shadow(0 0 12px #ff3b3b)}58%{transform:translate(-125px,72px) scale(1.2) rotate(-10deg)}75%{transform:translate(-110px,64px) scale(1.15) rotate(-8deg)}}
.die{animation:die .8s forwards}
@keyframes die{30%{transform:scale(1.2);filter:brightness(3)}100%{transform:scale(.1) rotate(260deg);opacity:0}}
.enter{animation:enter .55s ease-out}
@keyframes enter{from{transform:translateX(140px) scale(.6);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.flt{position:absolute;font:700 32px var(--display);color:var(--gold);text-shadow:0 3px 0 #000,0 0 10px #000;pointer-events:none;white-space:nowrap;animation:up 1s forwards;z-index:3}
.flt.crit{color:#ff9d3c;font-size:44px}.flt.small{font-size:24px;color:#9ff0c8}.flt.heal{color:var(--ok)}.flt.dmg{color:var(--hp)}.flt.coin{font-size:20px;color:var(--gold)}
@keyframes up{0%{transform:translate(-50%,0) scale(.4)}14%{transform:translate(-50%,-34px) scale(1.35)}28%{transform:translate(-50%,-18px) scale(1)}38%{transform:translate(-50%,-24px)}80%{opacity:1}100%{transform:translate(-50%,-62px);opacity:0}}
.flt.crit{-webkit-text-stroke:2px #5a1a00;animation:up 1s forwards,wob .12s 3}
@keyframes wob{50%{margin-left:4px}}
.slash{position:absolute;width:150px;height:7px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff,#fff8,transparent);box-shadow:0 0 12px #fff;transform:translate(-50%,-50%) rotate(-35deg) scaleX(0);animation:slash .32s forwards;pointer-events:none;z-index:3}
@keyframes slash{50%{transform:translate(-50%,-50%) rotate(-35deg) scaleX(1.2);opacity:1}100%{transform:translate(-50%,-50%) rotate(-35deg) scaleX(1.4);opacity:0}}
.pt{position:absolute;font-size:20px;color:var(--gold);pointer-events:none;animation:burst .75s ease-out forwards;z-index:3}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg);opacity:0}}
.qpanel{display:grid;gap:10px}
.qhead{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.qlabel{color:var(--muted);font-size:15px}
.qsent{font-size:23px;font-weight:700;text-align:center;line-height:1.6}
.qsent .hint{font-size:16px;color:var(--accent);font-weight:500}
.blank{color:var(--gold);border-bottom:3px solid var(--gold);padding:0 4px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.long{grid-template-columns:1fr}
.opt{font-size:19px;font-weight:700;padding:12px 10px;min-height:56px;font-family:var(--body)}
.opt.gone{visibility:hidden}
.opt.right{background:#1f5a44;border-color:var(--ok)}
.opt.wrong{background:#5a1f2c;border-color:var(--bad)}
.obox{min-height:52px;background:#0e1226;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.chip{background:var(--accent);color:#06233a;font-weight:700;border-radius:8px;padding:4px 10px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wt{font-size:18px;font-weight:700;padding:8px 12px}
.wt.used{visibility:hidden}
.fb{border-radius:12px;padding:12px;display:grid;gap:6px}
.fb.good{background:#173d31;border:2px solid var(--ok);text-align:center}
.fb.miss{background:#3d1722;border:2px solid var(--bad)}
.say{padding:4px 10px;font-size:18px}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pips{display:flex;gap:4px}
.pip{width:16px;height:16px;border-radius:50%;background:#0a0d1c;border:2px solid var(--line)}
.pip.on{background:var(--ok);border-color:#a8f5cf;box-shadow:0 0 8px var(--ok)}
.combo{color:#ff9d3c;font-family:var(--display);font-size:18px;min-width:64px}
/* result */
.stars{font-size:54px;letter-spacing:6px}
.stars span{display:inline-block;opacity:.2;filter:grayscale(1)}
.stars span.on{opacity:1;filter:none;animation:pop .5s backwards}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.4)}}
.bigicon{font-size:80px;line-height:1.1}
/* cards */
.list{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel2);border-radius:12px}
.upg{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.upg .ic{font-size:36px}
.flash{animation:flash .6s}
@keyframes flash{30%{box-shadow:0 0 0 4px var(--gold),0 0 28px var(--gold)}}
.petcard{text-align:center;display:grid;gap:6px;align-content:start}
.petcard .pe{font-size:62px;line-height:1.15;display:inline-block}
.petcard.active{border-color:var(--gold)}
.petcard.lock .pe{filter:grayscale(1) brightness(.2)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice button{font-size:28px;padding:8px 12px}
.choice.txt button{font-size:16px}
.choice button.sel,.petpick.sel{border-color:var(--gold);background:#3a3420}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:#0e1226;color:var(--ink)}
.wobble{display:inline-block;animation:wobble .25s infinite}
@keyframes wobble{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.reveal{display:inline-block;animation:pop .6s}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--gold);color:#2a1d00;font-weight:900;padding:10px 18px;border-radius:12px;z-index:50;box-shadow:0 6px 24px #0008;animation:tin 2.6s forwards;max-width:90vw;text-align:center}
@keyframes tin{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.cloudnote{font-size:12px;color:var(--muted);text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* equipment */
.hero-sp{position:relative}
.wpn{position:absolute;right:-20px;bottom:8px;font-size:32px;transform:rotate(-25deg);transform-origin:20% 80%;filter:drop-shadow(0 0 6px var(--ec))}
.arm{position:absolute;left:-10px;bottom:-4px;font-size:22px;filter:drop-shadow(0 0 5px var(--tc))}
.lunge .wpn{animation:swing .4s ease-out}
@keyframes swing{40%{transform:rotate(80deg) scale(1.35)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;min-width:90px}
.tabs button.on{border-color:var(--gold);background:#3a3420;color:var(--gold)}
.eqslot{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border-left:6px solid var(--tc)}
.eqic{font-size:38px;width:62px;height:62px;display:grid;place-items:center;border-radius:14px;background:#0e1226;border:3px solid var(--tc);box-shadow:0 0 14px color-mix(in srgb,var(--tc) 45%,transparent);flex:none}
.eqic.sm{font-size:28px;width:48px;height:48px;border-width:2px}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;background:var(--panel2);border-radius:12px;border-left:5px solid var(--tc)}
.iname{font-weight:900;color:var(--tc)}
.ibtns{display:grid;gap:6px}
.ibtns button{padding:6px 10px;font-size:14px}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad)}
.dex{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.dex span{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:#0e1226;border:2px solid var(--tc);font-size:18px}
.dex span.no{border-color:#2a3155;filter:grayscale(1) brightness(.25)}
.loot{display:grid;justify-items:center;gap:6px;padding:14px;border-radius:16px;border:3px solid var(--tc);background:radial-gradient(circle,color-mix(in srgb,var(--tc) 25%,transparent),transparent 70%);animation:pop .6s}
.loot .eqic{font-size:50px;width:80px;height:80px}
.weak{font-size:12px;color:var(--muted)}
/* 詛咒句、時態怪物 */
.curse{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px;border-radius:14px;background:radial-gradient(circle,#4a1e6a66,transparent 75%);border:2px solid #b77cff99;animation:cglow 2s ease-in-out infinite}
@keyframes cglow{50%{box-shadow:0 0 20px #b77cff99}}
.ctok{font-size:19px;font-weight:700;padding:6px 10px;font-family:var(--body)}
.curse .ctok:disabled{opacity:.9}
.curse .ctok.dim{opacity:.22}
.ctok.cspan{background:#5a1f2c;border-color:var(--bad);text-decoration:line-through}
.ctok.cfound{background:#1f5a44;border-color:var(--ok);text-decoration:line-through}
.ctok.cwrong{background:#4a3a10;border-color:var(--gold)}
.fix{font-size:17px}.fix s{color:var(--bad)}.fix b{color:var(--ok)}
.tbadge{position:absolute;right:5%;top:190px;background:#0e1226ee;border:2px solid var(--gold);border-radius:999px;padding:3px 12px;font-weight:900;font-size:15px;z-index:2;white-space:nowrap;animation:pop .45s}
.tbadge small{font-weight:500;color:var(--muted)}
.tm-past{filter:sepia(.9) saturate(.7) drop-shadow(0 0 8px #d9a35b)}.tm-future{filter:hue-rotate(150deg) drop-shadow(0 0 14px #7cc8ff)}.tm-perfect{filter:drop-shadow(0 0 16px #ffd35a)}.tm-pastprog{filter:sepia(.6) drop-shadow(0 0 12px #c79bff)}.tm-prog{filter:drop-shadow(0 0 12px #5fe0a0)}.tm-simple{filter:drop-shadow(0 0 12px #ffffff)}
/* ===== 寶可夢風格戰鬥與劇情 ===== */
.scene{position:relative;height:310px;border-radius:18px;overflow:hidden;border:3px solid var(--rc);background:linear-gradient(180deg,var(--b2),var(--b1) 78%)}
.scene .deco{position:absolute;font-size:26px;opacity:.45;pointer-events:none}
.plat{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.3),rgba(0,0,0,.28) 68%,transparent 71%)}
.plat.e{right:3%;top:150px;width:48%;height:42px}.plat.h{left:-2%;bottom:4px;width:58%;height:46px}
.ibox{position:absolute;background:#fff8e8;color:#2b1d3a;border:3px solid #2b1d3a;border-radius:14px 4px 14px 4px;padding:5px 10px;box-shadow:4px 4px 0 rgba(0,0,0,.35);font-size:14px;z-index:2}
.ebox{left:10px;top:10px;width:47%}.hbox{right:10px;bottom:12px;width:44%}
.ibox .lv{font:700 13px var(--display)}.ibox .weak{color:#7a5a8a;font-size:12px}
.hprow{display:flex;align-items:center;gap:5px;margin:2px 0}.hprow>span{font:700 11px var(--display);background:#2b1d3a;color:#ffd35a;border-radius:4px;padding:0 4px}
.hpb{flex:1;height:10px;background:#5a5a6a;border:2px solid #2b1d3a;border-radius:6px}.hpb>i{background:#4fd07a}.hpb.mid>i{background:#f4c430}.hpb.lo>i{background:#ef4b4b}
.scene .mon{position:absolute;right:7%;top:30px;line-height:0}.scene .mon.boss{right:3%;top:8px}
.scene .hero-box{position:absolute;left:3%;bottom:10px;display:flex;align-items:flex-end;line-height:0}
.scene .hero-sp{position:relative}.scene .pet-sp{margin-left:-16px;order:2}
.tbox{background:#fff8e8;color:#2b1d3a;border:3px solid #2b1d3a;border-radius:14px;padding:10px 34px 10px 14px;min-height:52px;font-weight:700;position:relative;box-shadow:4px 4px 0 rgba(0,0,0,.35);line-height:1.5}
.tnext{position:absolute;right:12px;bottom:6px;font-style:normal;color:#e2504a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.story{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(600px,94%);display:grid;gap:8px;cursor:pointer;animation:sheetUp .3s ease-out}
.story .sart{text-align:center;line-height:0}.story .who{display:block;color:#c0392b;font-size:15px}

<script>
const RAW_UNITS=[
/* ===== 區域 0：新手草原（小三～小四） ===== */
{r:0,t:'be 動詞 am / is / are',s:'be 動詞',rule:'I 用 am；he、she、it 和「一個」人或東西用 is；you、we、they 和「兩個以上」用 are。問句把 be 動詞搬到最前面。',ex:['I am a student.','My dog is cute.','Are they your friends?'],q:`
I ___ a student.|am|is|are|be|主詞 I 一定配 am。
She ___ my teacher.|is|am|are|be|she 是單數第三人稱，配 is。
They ___ in the park.|are|is|am|be|they（他們）是複數，配 are。
We ___ classmates.|are|is|am|be|we（我們）是複數，配 are。
You ___ very kind.|are|is|am|be|you 不管是一個人還是很多人，都配 are。
My dog ___ cute.|is|are|am|be|my dog 是一隻狗（單數），配 is。
Tom and Amy ___ friends.|are|is|am|be|Tom 和 Amy 是兩個人，複數配 are。
The books ___ on the desk.|are|is|am|be|books 有加 s 是複數，配 are。
It ___ a cat.|is|are|am|be|it 配 is。
___ you happy?|Are|Is|Am|Do|be 動詞問句：把 be 動詞放句首，you 配 Are。
___ he your brother?|Is|Are|Am|Does|he 配 is，問句放句首：Is he...?
A: Is she your sister? B: Yes, ___.|she is|she's|he is|she does|肯定簡答不能縮寫，要說 Yes, she is.
A: Are you a doctor? B: No, ___.|I'm not|I amn't|you aren't|I don't|問「你」要用「我」回答：No, I'm not.（英文沒有 amn't）
He ___ not a student. He is a teacher.|is|are|am|do|he 配 is，否定句在 is 後面加 not。
My mother and I ___ at home.|are|is|am|be|「我和媽媽」是兩個人，配 are。
Mr. Lin ___ our English teacher.|is|are|am|be|Mr. Lin 是一個人，配 is。
The cat ___ not hungry now.|is|are|am|does|the cat 是單數，配 is。
`},
{r:0,t:'a / an 與名詞複數',s:'a / an・複數',rule:'母音（a e i o u 的音）開頭用 an，其他用 a。兩個以上要用複數：多數加 s；s、x、sh、ch 結尾加 es；有些字是不規則變化，例如 child → children。',ex:['This is an apple.','I have two boxes.','The children are happy.'],q:`
This is ___ apple.|an|a|two|many|apple 是母音 a 開頭，用 an。
I have ___ egg.|an|a|two|many|egg 是母音 e 開頭，用 an。
He is ___ boy.|a|an|two|many|boy 是子音 b 開頭，用 a。
It is ___ orange.|an|a|two|many|orange 是母音 o 開頭，用 an。
She has ___ umbrella.|an|a|two|many|umbrella 是母音 u 開頭，用 an。
I see ___ bird in the tree.|a|an|two|many|bird 是子音開頭，用 a。
There is ___ old man in the park.|an|a|two|many|old 是母音開頭，所以是 an old man。
He is ___ honest boy.|an|a|two|many|honest 的 h 不發音，聽起來是母音開頭，用 an。
She is ___ university student.|a|an|two|many|university 的發音是 /ju/ 開頭（子音），用 a。
I have two ___.|dogs|dog|a dog|dogses|兩隻以上要用複數，dog 加 s。
Three ___ are in the room.|boxes|box|boxs|a box|x 結尾的字加 es：box → boxes。
There are five ___ in the classroom.|children|childs|child|childrens|child 的複數是不規則的 children。
I brush my ___ every morning.|teeth|tooth|tooths|teeths|tooth 的複數是 teeth。
Look at those ___.|buses|bus|buss|a bus|s 結尾的字加 es：bus → buses。
He has two ___.|watches|watch|watchs|a watch|ch 結尾的字加 es：watch → watches。
I like ___.（喜歡香蕉這種水果）|bananas|banana|a bananas|bananaes|說喜歡某一類東西，用複數 bananas。
There are four ___ in the garden.（女人）|women|womans|woman|womens|woman 的複數是 women。
`},
{r:0,t:'this / that / these / those',s:'this・that',rule:'近的一個用 this，遠的一個用 that；近的很多個用 these，遠的很多個用 those。回答時，單數用 it，複數用 they。',ex:['This is my pencil.','Those are your books.','Are these your cats? Yes, they are.'],q:`
___ is my pencil.（這個）|This|These|Those|They|近的「一個」用 this。

___ are your books.（那些）|Those|That|This|It|遠的「很多個」用 those。
A: Is this your bag? B: Yes, ___ is.|it|this|they|that|回答 this / that 的問句，用 it。
A: Are these your cats? B: Yes, ___ are.|they|these|it|those|回答 these / those 的問句，用 they。

___ girl is my cousin.（那個女孩）|That|Those|These|They|一個女孩在遠處，用 that。
___ flowers are beautiful.（這些花）|These|This|That|It|flowers 是複數，用 these。
I like ___ shoes.（那雙鞋）|those|that|this|it|shoes 是複數，用 those。
Is ___ your umbrella?（那個）|that|those|these|they|一把傘在遠處，用 that。
Are ___ your friends?（那些人）|those|that|this|it|很多人在遠處，用 those。
___ book is very interesting.（這本）|This|These|Those|They|一本書在近處，用 this。

{r:0,t:'Wh 問句：What / Who / Where / How',s:'Wh 問句',rule:'問東西用 What，問人用 Who，問地點用 Where，問時間用 When，問原因用 Why，問方法或狀態用 How；問「幾個」用 How many，問「誰的」用 Whose。',ex:['What is your name?','Where is my bag?','How many pens do you have?'],q:`

___ do you like, cats or dogs? — I like cats.|Which|Who|Where|How|在幾個選項裡選，用 Which。
___ is your birthday? — It's in May.|When|Where|Who|How|回答是時間，用 When 問。
___ are you sad? — Because I lost my dog.|Why|What|Where|How|回答用 Because，問句用 Why。
What ___ these? — They are apples.|are|is|am|do|these 是複數，配 are。
Where ___ your parents? — They're at home.|are|is|am|do|your parents 是複數，配 are。
A: What's your father's job? B: He is ___.|a cook|cook|an cook|cooks|職業前面要加 a / an：a cook。
`},

`},
{r:2,t:'可數不可數 some / any / many / much',s:'many・much',rule:'可數名詞可以加 s；不可數名詞（water, milk, money, time, bread）不能加 s。肯定句用 some，否定句和問句用 any。可數用 many / a few，不可數用 much / a little，兩種都可以用 a lot of。',ex:['I want some water.','How many apples do you want?','I don\'t have much time.'],q:`
I want ___ water.|some|any|many|a|肯定句用 some；water 不可數，不能用 many 或 a。
Is there ___ milk in the fridge?|any|many|a|an|問句用 any。
There aren't ___ eggs in the box.|any|some|much|a|否定句用 any。
How ___ apples do you want?|many|much|long|old|apples 可數，用 How many。
How ___ money do you have?|much|many|long|old|money 不可數，用 How much。
I don't have ___ time.|much|many|a|an|time 不可數，用 much。
She has ___ friends.|many|much|a|an|friends 可數複數，用 many。
Would you like ___ tea?|some|many|a few|an|請別人吃喝東西的問句用 some；tea 不可數。
There is ___ bread on the plate.|a little|a few|many|few|bread 不可數，用 a little。
I have ___ books in my bag.|a few|a little|much|little|books 可數，用 a few。
We need two ___ water.|bottles of|bottle of|bottles|bottle|不可數名詞用容器計算：two bottles of water。
Please give me ___ paper.（一張紙）|a piece of|a|an|piece of|一張紙：a piece of paper。
There ___ a lot of sugar in the cake.|is|are|have|has|sugar 不可數，用 is。
There ___ a lot of people in the park.|are|is|has|have|people 是複數，用 are。
I drink ___ milk every day.（很多）|a lot of|many|lot of|a lots of|不可數也能用 a lot of。
How much ___ the shoes?|are|is|do|does|shoes 是複數，用 are。
A: How much ___ this cake? B: It's 50 dollars.|is|are|do|does|this cake 是單數，用 is。
`},
{r:2,t:'過去式 be 動詞 was / were',s:'was・were',rule:'過去的狀態用 was / were。I、he、she、it 和單數用 was；you、we、they 和複數用 were。看到 yesterday、last、ago 就是過去。',ex:['I was tired yesterday.','They were at home last night.','Was he sick last week?'],q:`
I ___ tired yesterday.|was|were|am|is|yesterday 是過去，I 配 was。
They ___ at home last night.|were|was|are|is|last night 是過去，they 配 were。
She ___ ten years old last year.|was|were|is|are|last year 是過去，she 配 was。
We ___ in Tainan two days ago.|were|was|are|is|ago 是過去，we 配 were。
___ you at school yesterday?|Were|Was|Are|Did|you 的過去式配 were。
___ he sick last week?|Was|Were|Is|Did|he 的過去式配 was。
A: Were you busy? B: Yes, I ___.|was|were|did|am|回答「我」用 I was。
A: Was the movie good? B: No, it ___.|wasn't|weren't|didn't|isn't|the movie 單數，否定用 wasn't。
The weather ___ nice yesterday.|was|were|is|did|the weather 單數、過去，用 was。
My parents ___ not at home last Sunday.|were|was|are|did|my parents 複數、過去，用 were。
Where ___ you last night?|were|was|are|did|you 的過去式配 were。
There ___ a lot of people at the party yesterday.|were|was|are|is|people 是複數，過去用 were。
There ___ a cat on the roof an hour ago.|was|were|is|are|a cat 單數、過去，用 was。
How ___ your trip to Japan?（已經回來了）|was|were|did|is|旅行已經結束，用過去式 was。
It ___ cold and rainy last weekend.|was|were|is|did|last weekend 是過去，it 配 was。
Tom and I ___ classmates in elementary school.|were|was|are|is|兩個人、過去，用 were。
I ___ at the library this morning. Now I'm at home.|was|were|am|did|早上的事已經過去，用 was。
`},
{r:2,t:'一般動詞過去式',s:'過去式動詞',rule:'過去發生的事，動詞要變過去式：多數加 ed（play → played）；有些是不規則（go → went、see → saw、buy → bought）。問句和否定句用 did / didn\'t，後面動詞變回原形。',ex:['She went to the zoo last Sunday.','I bought a new bike.','Did you see Amy? Yes, I did.'],q:`
I ___ my homework yesterday.|finished|finish|finishes|finishing|yesterday 是過去，加 ed：finished。
She ___ to the zoo last Sunday.|went|goes|go|goed|go 的過去式是不規則的 went。
We ___ a movie last night.|saw|see|seen|seed|see 的過去式是 saw。
He ___ a new bike last week.|bought|buyed|buys|buy|buy 的過去式是 bought。
___ you go to school yesterday?|Did|Do|Were|Does|過去式一般動詞問句用 Did。
He didn't ___ breakfast this morning.|eat|ate|eats|eaten|didn't 後面接原形動詞。
They ___ soccer after school yesterday.|played|plaied|play|plays|母音 + y 直接加 ed：played。
She ___ the window an hour ago.|opened|opens|open|openned|an hour ago 是過去：opened。
I ___ my grandma last weekend.|visited|visit|visits|visitted|last weekend 是過去：visited。
The baby ___ all night last night.|cried|cryed|cries|cry|子音 + y：去 y 加 ied，cry → cried。
We ___ to the beach two days ago.|went|go|goes|gone|ago 是過去：went。
He ___ me a letter last month.|wrote|writed|writes|written|write 的過去式是 wrote。
What did you ___ last night?|do|did|does|done|did 後面接原形動詞 do。
A: Did you see Amy? B: Yes, I ___.|did|do|saw|was|用 Did 問，就用 did 回答。
He ___ his leg when he was playing basketball.|hurt|hurted|hurts|hurting|hurt 的過去式還是 hurt。
I ___ up late this morning.|got|get|gets|getted|get 的過去式是 got。
She ___ a cake for my birthday yesterday.|made|maked|makes|make|make 的過去式是 made。
`},
/* ===== 區域 3：龍之山脈（國二上） ===== */
{r:3,t:'未來式 will / be going to',s:'未來式',rule:'未來的事用 will + 原形動詞，或 be going to + 原形動詞（已經打算好、看得出來快發生）。看到 tomorrow、next、in the future 就要想到未來式。',ex:['I will visit my grandma tomorrow.','It is going to rain.','Are you going to play baseball?'],q:`
I ___ visit my grandma tomorrow.|will|was|did|am|tomorrow 是未來，用 will + 原形。
Look at the dark clouds. It is going to ___.|rain|rains|rained|raining|be going to 後面接原形動詞。
She ___ going to buy a new dress.|is|are|will|does|she 配 is going to。
We ___ have a test next Monday.|will|were|did|are|next Monday 是未來，用 will。
___ you come to my party tomorrow?|Will|Did|Are|Were|未來式問句：Will you...?
He will ___ a doctor in the future.|be|is|being|was|will 後面接原形 be。
They ___ going to play baseball this afternoon.|are|is|will|do|they 配 are going to。
I won't ___ late again.|be|am|being|to be|won't（= will not）後面接原形 be。
What ___ you going to do this weekend?|are|will|do|did|you 配 are going to。
It ___ be sunny tomorrow.|will|is|was|did|tomorrow 是未來，用 will be。
A: Will you go with us? B: Yes, I ___.|will|do|am|did|用 Will 問，就用 will 回答。
Tom ___ going to study in the US next year.|is|will|does|was|Tom 配 is going to。
I think it ___ rain tonight.|will|is|does|was|預測未來用 will + 原形。
My sister ___ thirteen next year.|will be|is going|will|is be|未來的年紀：will be thirteen。
She is going to ___ her room tomorrow.|clean|cleans|cleaned|cleaning|be going to 後面接原形動詞。
We are going to have a picnic ___.|next Sunday|last Sunday|yesterday|two days ago|be going to 是未來，要配未來時間 next Sunday。
If you study hard, you ___ pass the test.|will|did|are|were|if 句子說條件，結果用 will。
`},
{r:3,t:'過去進行式與 when / while',s:'過去進行式',rule:'過去某個時間「正在做」的事用 was / were + V-ing。while 後面常接「一段時間正在進行」的動作；when 後面常接「一下子就發生」的動作。',ex:['I was eating dinner when you called me.','While I was taking a shower, someone knocked on the door.'],q:`
I ___ dinner when you called me.|was eating|am eating|eat|eating|你打來時我「正在」吃飯，用過去進行式。
They ___ basketball at 3 p.m. yesterday.|were playing|are playing|was playing|play|昨天下午三點正在做，they 配 were + V-ing。
What ___ you doing at eight last night?|were|was|are|did|過去進行式問句：What were you doing?
She was ___ a book when the phone rang.|reading|read|reads|readed|was 後面接 V-ing。
___ I was taking a shower, someone knocked on the door.|While|What|Who|Which|while 接正在進行的一段動作。
When I got home, my mom ___ dinner.|was cooking|cooks|is cooking|cook|我到家時媽媽正在煮飯，用過去進行式。
It ___ when I left school.|was raining|is raining|rains|rain|我離開學校時正在下雨。
We were watching TV ___ the lights went out.|when|while|what|which|燈「突然」熄滅是一下子的動作，用 when。
My brother was sleeping ___ I was doing my homework.|while|what|which|who|兩件事同時在進行，用 while。
A: Were you sleeping when I called? B: No, I ___.|wasn't|weren't|didn't|am not|I 的過去式否定用 wasn't。
At 7 a.m. yesterday, Tom and Ben ___ to school.|were walking|was walking|are walking|walk|兩個人、過去某時正在做，用 were walking。
The kids ___ when the teacher came in.|were talking|was talking|talk|are talking|kids 是複數，用 were talking。
I saw a cat ___ I was walking home.|while|what|which|who|我正在走路回家「的時候」：while。
He ___ a bike when he fell down.|was riding|is riding|rides|ride|跌倒時正在騎腳踏車。
What was she ___ at that time?|doing|do|did|does|was 後面接 V-ing。
They were not ___ to music then.|listening|listen|listened|listens|were not 後面接 V-ing。
While Dad was washing the car, I ___ the dog.|was walking|am walking|walk|walks|兩件事同時在過去進行。
`},
{r:3,t:'比較級、最高級與 as...as',s:'比較級',rule:'兩者比較用「比較級 + than」，三者以上的「最…」用「the + 最高級」。短的字加 er / est，長的字用 more / most。不規則：good → better → best、bad → worse → worst。as + 原級 + as 表示「一樣」。',ex:['Tom is taller than Ben.','Mt. Jade is the highest mountain in Taiwan.','Ben is as tall as Tom.'],q:`
Tom is ___ than Ben.|taller|tall|tallest|more tall|有 than，用比較級 taller。
Which is ___, a cat or a dog?|bigger|biggest|big|biger|兩者比較用比較級：big → bigger（重複 g）。
This is the ___ book in the library.|most interesting|more interesting|interestinger|interesting|長的形容詞，最高級用 the most。
Math is ___ than English for me.|more difficult|difficulter|most difficult|difficult|長的形容詞比較級用 more。
Mt. Jade is the ___ mountain in Taiwan.|highest|higher|high|most high|全台灣「最」高，用最高級 highest。
Ben is as tall ___ Tom.|as|than|so|like|as...as 表示「和…一樣」。
This bag is ___ than that one.|cheaper|cheap|cheapest|more cheap|短的字加 er：cheaper。
Today is ___ than yesterday.|hotter|hoter|hot|hottest|hot → hotter（重複 t）。
She is the ___ girl in our class.|prettiest|prettyest|prettier|pretty|子音 + y：去 y 加 iest。
My English is ___ than before.|better|good|best|gooder|good 的比較級是 better。
This is the ___ day of my life.|worst|bad|worse|baddest|bad 的最高級是 worst。
Who runs ___, Tom or Jack?|faster|fast|fastest|more fast|兩人比較用 faster。
Of the three boys, Ken is ___.|the youngest|younger|young|the younger|三人之中「最」年輕，用 the youngest。
My bag is not as ___ as yours.|heavy|heavier|heaviest|heavyer|as...as 中間用原級。
He has ___ books than I do.|more|many|much|most|many 的比較級是 more。
This is ___ than that.（更有用）|more useful|usefuler|most useful|useful|useful 比較長，用 more useful。
Taipei 101 is one of the ___ buildings in the world.|tallest|taller|tall|most tall|one of the + 最高級 + 複數名詞。
`},
{r:3,t:'助動詞 should / must / have to / may',s:'助動詞',rule:'should 應該、must 必須、mustn\'t 禁止、have to 必須（主詞第三人稱用 has to）、don\'t have to 不必、may / can 可以。助動詞後面一律接原形動詞。',ex:['You should go to bed early.','You mustn\'t eat in the library.','We don\'t have to wear uniforms.'],q:`
You ___ wear a helmet when you ride a motorcycle.（必須）|must|mustn't|can't|don't|「必須」用 must。
You ___ eat in the library.（禁止）|mustn't|must|have to|should|「禁止」用 mustn't。
You look tired. You ___ go to bed early.（應該）|should|shouldn't|mustn't|don't|「應該」用 should。
She has to ___ her homework first.|finish|finishes|finished|finishing|has to 後面接原形動詞。
He ___ to get up early tomorrow.|has|have|must|should|主詞 he，用 has to。
We don't ___ to wear uniforms on Fridays.|have|has|must|should|「不必」是 don't have to。
___ I use your pen? — Sure.|May|Must|Do|Am|請求許可用 May I...?
You ___ smoke here. It's not allowed.|can't|can|should|must|不被允許：can't。
Students ___ be late for school.|shouldn't|should|have to|must|學生「不應該」遲到。
Do I have to ___ now?|leave|leaving|leaves|to leave|have to 後面接原形動詞。
You don't have to ___. We have enough food.|bring|brings|bringing|brought|don't have to 後面接原形動詞。
It's cold outside. You ___ wear a coat.|should|shouldn't|mustn't|can't|外面冷，「應該」穿外套。
A: Must I clean my room now? B: No, you ___. You can do it later.|don't have to|mustn't|must|can't|「不必」現在做：don't have to。
She ___ speak three languages.|can|cans|can to|is can|can 不加 s，後面接原形。
Could you ___ me a favor?|do|does|doing|did|Could 後面接原形動詞。
My brother ___ go to school yesterday because he was sick.|couldn't|can't|mustn't|doesn't|昨天（過去）不能去，用 couldn't。
Would you like to ___ some cake?|have|has|having|had|would like to 後面接原形動詞。
`},
{r:3,t:'不定詞 to V 與動名詞 V-ing',s:'to V・V-ing',rule:'有些動詞後面接 to V：want, hope, decide, plan, would like。有些接 V-ing：enjoy, finish, stop, keep, mind。介系詞（for, at, about）後面接 V-ing。V-ing 也可以當主詞。to V 可以表示「為了…」。',ex:['I enjoy reading comics.','I want to be a doctor.','Swimming is good for your health.'],q:`
I enjoy ___ comics.|reading|to read|read|reads|enjoy 後面接 V-ing。
I want ___ a doctor.|to be|being|be|am|want 後面接 to V。
He decided ___ hard.|to study|studying|study|studied|decide 後面接 to V。
Thank you for ___ me.|helping|help|to help|helped|介系詞 for 後面接 V-ing。
She finished ___ her room.|cleaning|to clean|clean|cleans|finish 後面接 V-ing。
Please stop ___. The baby is sleeping.|talking|to talk|talk|talked|stop V-ing 是「停止做某事」。
I hope ___ you again.|to see|seeing|see|saw|hope 後面接 to V。
He is good at ___.|swimming|swim|to swim|swims|介系詞 at 後面接 V-ing。
___ is good for your health.|Swimming|Swim|Swims|Swam|V-ing 可以當主詞。
I went to the store ___ some milk.|to buy|buying|buy|bought|to V 表示目的「為了買牛奶」。
How about ___ a walk?|taking|take|to take|took|How about 後面接 V-ing。
Don't forget ___ the door.|to lock|lock|locked|locks|「記得要去做」用 forget to V。
She keeps ___ the same song.|singing|to sing|sing|sang|keep 後面接 V-ing。
It's time ___ bed.|for|to|of|at|It's time for + 名詞。
It's time ___ to bed.|to go|going|go|went|It's time to + 原形動詞。
I would like ___ a cup of tea.|to have|having|have|had|would like 後面接 to V。
My hobby is ___ pictures.|taking|take|takes|took|be 動詞後面可以接 V-ing 當補語。
`},

{r:4,t:'感官動詞、連綴動詞、使役動詞',s:'look・make・let',rule:'look、sound、smell、taste、feel 後面接形容詞（不是副詞）。look like / feel like 後面接名詞或 V-ing。see、hear、watch + 人 + 原形動詞；make、let、have + 人 + 原形動詞。',ex:['The cake smells good.','I saw him cross the street.','My mom made me clean my room.'],q:`
The cake smells ___.|good|well|goodly|nicely|smell 是連綴動詞，後面接形容詞 good。
You look ___ today.|happy|happily|happiness|happyly|look（看起來）後面接形容詞。
This song sounds ___.|beautiful|beautifully|beauty|beautifuly|sound（聽起來）後面接形容詞。
The soup tastes ___.|salty|saltily|salt|salts|taste（嚐起來）後面接形容詞。
She looks ___ her mother.|like|as|to|alike|「看起來像某人」：look like + 名詞。
I feel ___ eating ice cream.|like|as|to|for|「想要做某事」：feel like + V-ing。
I saw him ___ the street.|cross|crosses|to cross|crossed|see + 人 + 原形動詞。
I heard someone ___ my name.|call|to call|calls|called|hear + 人 + 原形動詞。
We watched the boys ___ basketball.|play|to play|plays|played|watch + 人 + 原形動詞。
My mom made me ___ my room.|clean|to clean|cleans|cleaned|make + 人 + 原形動詞（叫某人做）。
Let me ___ you.|help|to help|helps|helped|let + 人 + 原形動詞。
My teacher had us ___ the poem.|read|to read|reads|readed|have + 人 + 原形動詞（叫某人做）。
The joke made everyone ___.|laugh|to laugh|laughs|laughed|make + 人 + 原形動詞。
Don't let the dog ___ out.|go|to go|goes|going|let + 動物 + 原形動詞。
He looks ___. Is he sick?|tired|tiredly|tire|tiring|look 後面接形容詞 tired。
It feels ___ to swim in the sea.|great|greatly|greats|greatness|feel 後面接形容詞。
I listened to the birds ___.|sing|to sing|sings|sang|listen to + 對象 + 原形動詞。
`},
{r:4,t:'連接詞 and / but / so / because / although / if',s:'連接詞',rule:'but 但是、so 所以、because 因為、although 雖然、or 或者、if 如果、before 之前、after 之後、as soon as 一…就…。注意：because 和 so 不能同時用；although 和 but 不能同時用。if、as soon as 句子裡用現在式表示未來。',ex:['It was raining, so we stayed home.','Although it was cold, he didn\'t wear a coat.','If it rains tomorrow, we will stay home.'],q:`
I like dogs, ___ my sister likes cats.|but|so|because|or|前後意思相反，用 but。
It was raining, ___ we stayed home.|so|but|because|or|下雨是原因，待在家是結果：so。
I stayed home ___ I was sick.|because|so|but|or|生病是原因，用 because。
Do you want tea ___ coffee?|or|and|but|so|二選一用 or。
___ it was cold, he didn't wear a coat.|Although|Because|So|If|「雖然冷，但沒穿外套」：Although。
Wash your hands ___ you eat.（吃飯前）|before|after|so|but|「在…之前」用 before。
I'll call you as soon as I ___ home.|get|will get|got|getting|as soon as 句子用現在式表示未來。
If it ___ tomorrow, we will stay home.|rains|will rain|rained|rain|if 句子用現在式代替未來式。
___ you study hard, you will pass the test.|If|Although|So|But|「如果」用 if。
I brushed my teeth ___ I went to bed.|before|so|but|or|「睡覺之前」刷牙：before。
He was hungry, ___ he ate two bowls of rice.|so|but|because|although|餓是原因，吃兩碗是結果：so。
She can go out ___ she finishes her homework.（寫完功課之後）|after|before|so|but|「在…之後」用 after。
選出正確的句子|Although he is rich, he isn't happy.|Although he is rich, but he isn't happy.|Because he is rich, so he isn't happy.|He is rich, although but he isn't happy.|although 和 but 不能一起用。
選出正確的句子|Because it rained, we stayed home.|Because it rained, so we stayed home.|Because it rained, but we stayed home.|It rained, because so we stayed home.|because 和 so 不能一起用。
Both Tom ___ Jerry like cheese.|and|or|but|so|both A and B（A 和 B 都）。
Either you ___ I am wrong.|or|and|nor|but|either A or B（不是 A 就是 B）。
When I was young, I ___ in Kaohsiung.|lived|live|lives|living|when I was young 是過去，用過去式 lived。
`},
{r:4,t:'反身代名詞與 other / another / both / every',s:'myself・other',rule:'自己對自己做的事用反身代名詞：myself, yourself, himself, herself, itself, ourselves, yourselves, themselves。兩個裡的另一個用 the other；再一個用 another；兩個都用 both；每一個 every / each 後面接單數。',ex:['I hurt myself.','One is red, and the other is blue.','Each of the boys has a bike.'],q:`
I hurt ___ when I fell.|myself|me|my|mine|自己傷到自己：myself。
She looked at ___ in the mirror.|herself|her|she|hers|她看著鏡子裡的自己：herself。
Help ___ to some cake, kids.|yourselves|yourself|you|your|kids 是很多人，用 yourselves。
He taught ___ to play the guitar.|himself|him|his|he|自學：teach oneself。
We enjoyed ___ at the party.|ourselves|us|our|ourself|enjoy oneself（玩得開心），we 用 ourselves。
The cat cleans ___.|itself|it|its|it's|貓清理自己：itself。
I have two pens. One is red, and ___ is blue.|the other|another|other|the others|兩個中的「另一個」：the other。
This cake is great. Can I have ___ piece?|another|other|the other|others|「再一個」用 another。
Some students like math, and ___ like English.|others|other|another|the other|some...others...（有些…有些…）。
I have three sisters. One is a nurse, and ___ are teachers.|the others|the other|another|other|三個中剩下的全部：the others。
___ of my parents are teachers.|Both|Either|Every|Each|兩個人「都」：both，配 are。
You can sit on ___ side.（兩邊任一邊）|either|both|all|every|兩者任一：either + 單數名詞。
___ student has a book.|Every|All|Both|Many|every + 單數名詞，配 has。
___ the students are in the classroom.|All|Every|Each|Either|all（全部）+ 複數，配 are。

All the tickets ___ sold out by the time we got there.|had been|have been|are|were being|我們到（過去）之前票就被賣完，用 had been + p.p.。
The rules must ___ by every student.|be followed|follow|be following|followed|助動詞被動：must be + p.p.。
It ___ that the temple is over 300 years old.|is said|says|is saying|said|It is said that…（據說…）。
He is said ___ the richest man in town.|to be|being|be|that is|人 + is said + to V。
The new bridge will ___ next year.|be completed|complete|be completing|completed|未來被動：will be + p.p.。
I was made ___ for two hours.|to wait|wait|waiting|waited|make 變被動後要加 to：be made to V。
The children ___ care of by their grandmother.|are taken|take|are taking|taken|小孩「被」照顧：are taken care of。
This kind of fish can ___ in the river.|be found|find|be finding|found|魚「能被」找到：can be found。
The problem ___ at the meeting right now.|is being discussed|is discussing|discusses|has discussed|問題「正在被」討論，用 is being + p.p.。
English ___ as a second language in many countries.|is used|uses|is using|used|英文「被」使用，用 is used。
He hates ___ at by others.|being laughed|laughing|to laugh|laughed|討厭「被」嘲笑，用 being + p.p.。
Three new schools ___ in our town since 2020.|have been built|have built|are building|built|since 用完成式，學校「被」建，用 have been built。
`},
/* ===== 區域 7：星辰神殿（高二） ===== */
{r:7,t:'假設語氣',s:'假設語氣',rule:'與「現在」事實相反：If + 過去式（be 動詞一律用 were）, 主詞 + would / could + 原形。與「過去」事實相反：If + had p.p., 主詞 + would have + p.p.。wish 後面也用過去式（現在做不到）或 had p.p.（過去沒做到）。真的可能發生的事，if 子句用現在式。',ex:['If I were you, I would accept the offer.','If he had studied harder, he would have passed the exam.','I wish I could fly like a bird.'],q:`
If I ___ you, I would accept the offer.|were|am|be|will be|與現在事實相反（我不是你），be 動詞用 were。
If I had enough money, I ___ a new computer.|would buy|will buy|bought|buy|與現在事實相反：If + 過去式, would + 原形。
If he had studied harder, he ___ the exam.|would have passed|would pass|will pass|passed|與過去事實相反：would have + p.p.。
I wish I ___ fly like a bird.|could|can|will|am able to|wish 後面用過去式 could，表示現在做不到的願望。
If it ___ tomorrow, we will cancel the picnic.|rains|rained|had rained|would rain|明天真的可能下雨，不是假設語氣，if 子句用現在式。
I wish I ___ to the party last night.|had gone|went|go|would go|對過去的後悔，wish + had p.p.。
He talked as if he ___ the president himself.|were|is|will be|has been|as if 後面說的不是事實，be 動詞用 were。
If I ___ about the meeting, I would have attended it.|had known|knew|know|would know|與過去事實相反，if 子句用 had p.p.。
It's time we ___ home.|went|go|will go|have gone|It's time + 主詞 + 過去式（該…了）。
___ I known the truth, I would have told you.|Had|Have|If|Did|省略 if 的倒裝：Had I known = If I had known。
If she were here now, she ___ us what to do.|would tell|will tell|told|tells|與現在事實相反，主要子句用 would + 原形。
What would you do if you ___ the lottery?|won|win|will win|had win|假設現在中樂透（不太可能），if 子句用過去式 won。
Without your help, I ___ have finished the project.|couldn't|can't|won't|didn't|Without… = 要是當時沒有…，用 couldn't have + p.p.。
If only I ___ more time! I'm so busy now.|had|have|will have|am having|If only（要是…就好了）+ 過去式，與現在事實相反。
`},
{r:7,t:'分詞構句',s:'分詞構句',rule:'前後兩個子句主詞相同時，可以把連接詞和主詞去掉，動詞改成分詞：主詞主動做用 V-ing；主詞被動用 p.p.；比主要動詞更早發生用 Having + p.p.；否定在最前面加 Not。with + 受詞 + V-ing / p.p. 表示附帶的狀況。',ex:['Hearing the news, she burst into tears.','Seen from the mountain, the city looks beautiful.','Not knowing what to do, I asked my teacher for help.'],q:`
___ the news, she burst into tears.|Hearing|Heard|Hear|To hearing|她主動聽到消息，用 V-ing。
___ from the top of the mountain, the city looks beautiful.|Seen|Seeing|See|To see|城市是「被看」，用 p.p. Seen。
___ his homework, he went out to play basketball.|Having finished|Finished|Finish|Being finish|先寫完功課再出去，用 Having + p.p.。
___ what to do, I asked my teacher for help.|Not knowing|Knowing not|Not known|Don't know|分詞構句的否定：Not 放在分詞前面。
___ in simple English, the book is easy to read.|Written|Writing|Wrote|Having writing|書是「被寫」的，用 p.p. Written。
He sat on the sofa, ___ TV.|watching|watched|watch|to watched|他主動看電視，兩個動作同時發生，用 watching。
___ tired, he went to bed early.|Feeling|Felt|Feel|To feeling|他自己覺得累，用 Feeling。
She stood there with her arms ___.|crossed|crossing|cross|to cross|手臂是「被交叉」的：with + 受詞 + p.p.。
___ by his teacher, he felt very proud.|Praised|Praising|Praise|Having praised|他「被」老師稱讚，用 p.p. Praised。
Generally ___, boys like sports more than girls do.|speaking|spoken|speak|to speak|Generally speaking（一般來說）是固定用法。
___ from his accent, he must be from the south.|Judging|Judged|Judge|To judging|Judging from…（從…判斷）是固定用法。
The boy ran out of the room with tears ___ down his face.|running|run|ran|to run|眼淚主動流下：with + 受詞 + V-ing。
___ the door, he found the room empty.|Opening|Opened|Open|Being opened|他主動開門，用 Opening。
___ many times, he still didn't give up.|Having failed|Failed|Fail|Being fail|先失敗很多次（更早發生），用 Having failed。
`},
{r:7,t:'助動詞 + have p.p.：對過去的推測與後悔',s:'助動詞完成式',rule:'must have p.p. 當時一定…；may / might have p.p. 當時可能…；can\'t have p.p. 當時不可能…。should have p.p. 當時應該做卻沒做；shouldn\'t have p.p. 不該做卻做了；needn\'t have p.p. 不必做卻做了；could have p.p. 當時可以做卻沒做。',ex:['The ground is wet. It must have rained last night.','You should have told me earlier.','He can\'t have passed the exam.'],q:`
The ground is wet. It ___ last night.|must have rained|must rain|should rain|can't have rained|從地濕推測昨晚「一定下過雨」，用 must have p.p.。
You ___ me earlier. Now it's too late.|should have told|must have told|should tell|can't have told|當時「應該告訴我卻沒有」，用 should have p.p.。
He ___ the exam. He didn't study at all.|can't have passed|must have passed|should pass|needn't pass|完全沒讀書，「不可能通過」，用 can't have p.p.。
I'm not sure where she is. She ___ home.|may have gone|should have gone|must go|can't go|不確定，「可能已經」回家，用 may have p.p.。
You ___ so much last night. That's why you have a stomachache now.|shouldn't have eaten|shouldn't eat|mustn't eat|can't have eaten|昨晚「不該吃卻吃了」，用 shouldn't have p.p.。
She didn't answer the phone. She ___ asleep.|must have been|should be|can't be|needn't be|推測當時「一定是」睡著了，用 must have been。
You ___ an umbrella. It didn't rain at all.|needn't have brought|must have brought|can't have brought|should have brought|「不必帶卻帶了」，用 needn't have p.p.。
I ___ harder when I was young. I regret it now.|should have studied|must have studied|can't have studied|may study|後悔年輕時「應該用功卻沒有」，用 should have p.p.。
He ___ the letter. I saw it on his desk, unopened.|can't have read|must have read|should read|may read|信沒拆，他「不可能讀過」，用 can't have p.p.。
They ___ lost. They are two hours late.|must have gotten|should have gotten|needn't have gotten|can't have gotten|遲到兩小時，推測「一定是」迷路了。
I ___ my keys at the office. I can't find them anywhere.|must have left|should leave|needn't have left|shouldn't leave|到處找不到，「一定是」留在辦公室了。
You ___ at him. He was only trying to help.|shouldn't have shouted|must have shouted|needn't shout|can't shout|他只是想幫忙，你「不該吼他卻吼了」。
She ___ us, but she chose not to.|could have helped|must have helped|can help|should help|「當時可以幫卻沒幫」，用 could have p.p.。
The lights are off. They ___ out.|must have gone|should have gone|needn't have gone|shouldn't go|燈關著，推測他們「一定是」出去了。
`},
{r:7,t:'名詞子句、同位語與強調句',s:'名詞子句・強調句',rule:'The fact / news / idea + that 子句，說明前面名詞的內容（同位語）。whether… or not 表示「是否」。強調句：It is / was + 要強調的部分 + that + 其餘部分。疑問詞加 ever：whatever 無論什麼、whoever 無論誰、wherever 無論哪裡、however 無論多麼。',ex:['The fact that he lied made her angry.','It was Tom that broke the window.','Wherever you go, I will follow you.'],q:`
The fact ___ he lied made her angry.|that|which|what|whether|the fact + that 子句，說明事實的內容。
I don't know ___ he will come or not.|whether|that|what|which|whether… or not（是否）。
It was Tom ___ broke the window.|that|what|which|whom|強調句：It was + 強調的部分 + that…。
___ you go, I will follow you.|Wherever|Whatever|Whoever|However|「無論你去哪裡」用 Wherever。
___ wins the game will get the prize.|Whoever|Whatever|Wherever|Whenever|「無論誰贏」用 Whoever（= Anyone who）。
It was in 2010 ___ I first visited Japan.|that|which|what|who|強調時間 in 2010 的強調句，用 that。
___ hard he tried, he couldn't open the door.|However|Whatever|Whoever|Wherever|However + 形容詞／副詞 = 無論多麼…。
The news ___ our team won excited everyone.|that|which|what|who|the news + that 子句，說明消息的內容。
___ matters most is your health.|What|That|Which|Whether|What matters most = 最重要的事。
I have no idea ___ she is from.|where|that|what|which|「她從哪裡來」用 where。
You can take ___ you like from the table.|whatever|however|wherever|whenever|「任何你喜歡的東西」用 whatever。
It is not what you say ___ what you do that matters.|but|and|or|so|not A but B（不是 A 而是 B）。
___ he is rich is known to everyone.|That|What|Which|Who|That 子句當主詞：「他很有錢」這件事。
The question is ___ we can finish the work on time.|whether|that|which|what|問題是「是否」能準時完成，用 whether。
`},
/* ===== 區域 8：時空之塔（高三） ===== */
{r:8,t:'倒裝句',s:'倒裝句',rule:'否定詞（Never、Seldom、Hardly、Little、Not only、Not until、No sooner）或 Only + 副詞放在句首時，後面要像問句一樣倒裝：助動詞或 be 動詞放到主詞前面。So / Neither + 助動詞 + 主詞 表示「也是／也不」。地方副詞放句首時，動詞直接放到主詞前面。',ex:['Never have I seen such a beautiful sunset.','Not only does he speak English, but he also speaks French.','Here comes the bus!'],q:`
Never ___ such a beautiful sunset.|have I seen|I have seen|I saw|did I saw|Never 放句首要倒裝：have 放到主詞 I 前面。
Not only ___ English, but he also speaks French.|does he speak|he speaks|he does speak|speaks he|Not only 放句首要倒裝：does he speak。
Seldom ___ late for school.|is she|she is|does she|she does|Seldom 放句首，be 動詞 is 放到主詞前面。
Only then ___ how much she loved me.|did I realize|I realized|I did realize|realized I|Only + 副詞放句首要倒裝：did I realize。
A: I like music. B: So ___ I.|do|am|like|have|「我也是」：So + 助動詞 + 主詞；like 是一般動詞，用 do。
A: I can't swim. B: Neither ___ I.|can|do|am|can't|「我也不會」：Neither + can + 主詞；Neither 本身已經是否定。
Hardly ___ home when it began to rain.|had I got|I had got|did I got|I got|Hardly… when…（一…就…），Hardly 放句首用 had + 主詞 + p.p.。
Not until midnight ___ home.|did he come|he came|came he|he did come|Not until 放句首，主要子句倒裝：did he come。
Little ___ that the test would be so hard.|did I know|I knew|I did know|knew I|Little 放句首（完全不知道）要倒裝：did I know。
Here ___ the bus!|comes|is come|does come|coming|地方副詞 Here 放句首，動詞直接放主詞前面：Here comes the bus。
No sooner ___ the house than the phone rang.|had I left|I had left|did I leave|I left|No sooner… than…（一…就…），用 had + 主詞 + p.p.。
Only by working hard ___ succeed.|can you|you can|you do|do you can|Only by… 放句首要倒裝：can you succeed。
So tired ___ that he fell asleep at once.|was he|he was|did he|he did|So + 形容詞放句首要倒裝：was he。
Under the tree ___ an old man.|sat|did sit|was sat|sitting|地方副詞片語放句首，動詞直接放主詞前面：sat an old man。
`},
{r:8,t:'比較與特殊句型',s:'特殊句型',rule:'The + 比較級…, the + 比較級…（越…就越…）。倍數 + as + 原級 + as。so + 形容詞 + a + 名詞 + that；such + a + 形容詞 + 名詞 + that。prefer A to B。would rather + 原形。not… until（直到…才）。so that + 子句（以便）；in order to + 原形（為了）。It is no use + V-ing。',ex:['The more you practice, the better you will become.','This room is three times as large as that one.','It is no use crying over spilt milk.'],q:`
The more you practice, ___ you will become.|the better|better|the best|more better|The + 比較級, the + 比較級（越…越…）。
This room is three times ___ that one.|as large as|larger as|as larger than|large than|倍數 + as + 原級 + as。
I prefer tea ___ coffee.|to|than|from|over than|prefer A to B（喜歡 A 勝過 B），用 to 不用 than。
He didn't go to bed ___ he finished his report.|until|since|while|during|not… until（直到…才…）。
She got up early ___ she could catch the first bus.|so that|in order to|because of|so as|so that + 子句（以便…）。
___ you study, the better grades you will get.|The harder|Harder|The hardest|More hard|The + 比較級…, the + 比較級…。
It was ___ a difficult question that nobody could answer it.|such|so|very|too|such + a + 形容詞 + 名詞 + that。
He is ___ honest a man that everyone trusts him.|so|such|very|too|so + 形容詞 + a + 名詞 + that。
I would rather ___ at home than go out tonight.|stay|to stay|staying|stayed|would rather + 原形動詞。
He saved money ___ buy a new bike.|in order to|so that|because|for that|in order to + 原形動詞（為了…）。
There is no ___ what will happen tomorrow.|telling|to tell|tell|told|There is no + V-ing（無法…）。
It is no use ___ over spilt milk.|crying|to cry|cry|cried|It is no use + V-ing（…是沒有用的）。
She is one of the students who ___ always on time.|are|is|be|am|who 指的是 the students（複數），動詞用 are。
Not only the students but also the teacher ___ excited about the trip.|is|are|be|am|not only A but also B，動詞跟最靠近的 the teacher，用 is。
`},
{r:8,t:'連接副詞、介系詞片語與轉折',s:'轉折與因果',rule:'however（然而）、therefore（因此）、moreover（此外）、otherwise（否則）是副詞，連接兩個句子時前面要用分號或句號。because of、due to、despite、in spite of 後面接名詞或 V-ing；because、although、even though 後面接子句。as long as 只要；unless 除非；in case 以防萬一；as soon as 一…就。',ex:['Because of the heavy rain, the game was canceled.','Although he was ill, he went to work as usual.','She is rich; however, she is not happy.'],q:`
___ the heavy rain, the game was canceled.|Because of|Because|Although|Despite of|後面是名詞 the heavy rain，用 Because of。
___ his illness, he went to work as usual.|Despite|Although|Because|Even though|後面是名詞 his illness，用 Despite（儘管）。
___ he was ill, he went to work as usual.|Although|Despite|Because of|In spite of|後面是子句 he was ill，用 Although。
He studied hard; ___, he passed the exam.|therefore|however|otherwise|although|用功所以通過，因果關係用 therefore。
She is rich; ___, she is not happy.|however|therefore|moreover|because|有錢卻不快樂，轉折用 however。
Hurry up; ___, you will miss the train.|otherwise|therefore|moreover|however|otherwise（否則）。
You won't succeed ___ you work hard.|unless|if|because|so|unless = if… not（除非）。
Take an umbrella ___ it rains.|in case|unless|so that|even|in case（以防萬一）。
You can borrow my bike ___ you return it tomorrow.|as long as|unless|although|in case|as long as（只要）。
The flight was delayed ___ the typhoon.|due to|because|although|so that|後面是名詞 the typhoon，用 due to。
He is smart; ___, he is very hardworking.|moreover|however|otherwise|unless|再補充一個優點，用 moreover（此外）。
___ being tired, she kept on working.|In spite of|Although|Because|Even though|後面是 V-ing，用 In spite of。
I'll call you ___ I arrive at the airport.|as soon as|as long as|unless|even though|as soon as（一…就…）。
___ it was raining, we decided to go hiking.|Even though|Despite|Because of|In spite of|後面是子句 it was raining，用 Even though。
`},
{r:8,t:'主詞動詞一致、代名詞與平行結構',s:'一致與平行',rule:'Each、Every、Either、Neither + 單數動詞。A as well as B 的動詞看 A；Either A or B、Not only A but also B 看最靠近的 B。The number of + 複數名詞用單數動詞；A number of 用複數動詞。and / or 連接的字要同一種形式（平行結構）。比較時用 that（單數）、those（複數）代替前面的名詞。',ex:['Each of the students has a dictionary.','A number of students are absent today.','She likes singing, dancing, and painting.'],q:`
Each of the students ___ a dictionary.|has|have|are having|having|Each of… 視為單數，用 has。
The number of students in our school ___ increasing.|is|are|be|have|The number of…（…的數量）是單數，用 is。
A number of students ___ absent today.|are|is|be|has|A number of…（許多）是複數，用 are。
Neither of the answers ___ correct.|is|are|be|being|Neither of… 視為單數，用 is。
Either you or he ___ wrong.|is|are|am|be|Either A or B，動詞跟最靠近的 he，用 is。
The teacher as well as the students ___ going to the museum.|is|are|be|have|A as well as B，動詞看前面的 A（the teacher），用 is。
She likes singing, dancing, and ___.|painting|to paint|paint|painted|平行結構：前面都是 V-ing，後面也用 V-ing。
Ten years ___ a long time.|is|are|be|have|時間、金錢、距離當作一個整體，用單數動詞 is。
He is good at both playing the piano and ___ pictures.|drawing|to draw|draw|drew|both A and B 要平行：playing 和 drawing。
Every boy and girl ___ invited to the party.|was|were|are|have|Every A and B 視為單數，用 was。
The rich ___ not always happy.|are|is|be|has|the + 形容詞 = 那一類的人（複數），用 are。
Mathematics ___ my favorite subject.|is|are|be|have|學科名稱雖然 s 結尾，仍是單數，用 is。
The weather in Taipei is hotter than ___ in Hualien.|that|it|this|those|用 that 代替前面的單數名詞 the weather。
The ears of a rabbit are longer than ___ of a cat.|those|that|them|it|用 those 代替前面的複數名詞 the ears。
`}
];

<script>
/* ===== 原創角色造型（SVG 程式繪製） ===== */
const OL='#2b1d3a';
const SW=`stroke="${OL}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const Ep=(cx,cy,rx,ry)=>`M${cx-rx},${cy} a${rx},${ry} 0 1,0 ${rx*2},0 a${rx},${ry} 0 1,0 ${-rx*2},0Z`;
function bodyOf(t){switch(t){
  case 'tall':return {d:Ep(0,4,26,38),top:-34,rx:26,cy:4,ry:38,eyeY:-10};
  case 'wide':return {d:Ep(0,14,42,26),top:-12,rx:42,cy:14,ry:26,eyeY:4};
  case 'drop':return {d:'M0,-34 C26,-34 36,-8 36,16 L36,36 Q27,28 18,36 Q9,44 0,36 Q-9,28 -18,36 Q-27,44 -36,36 L-36,16 C-36,-8 -26,-34 0,-34Z',top:-34,rx:36,cy:4,ry:36,eyeY:-6,noFeet:1};
  case 'blob':return {d:'M-40,36 C-42,8 -26,-24 0,-24 C26,-24 42,8 40,36 Z',top:-24,rx:40,cy:8,ry:30,eyeY:4,noFeet:1};
  default:return {d:Ep(0,8,34,32),top:-24,rx:34,cy:8,ry:32,eyeY:-2};}}
function flame(x,y,s,c1,c2){return `<path d="M${x},${y-22*s} C${x+15*s},${y-8*s} ${x+12*s},${y+10*s} ${x},${y+12*s} C${x-12*s},${y+10*s} ${x-15*s},${y-6*s} ${x},${y-22*s}Z" fill="${c1||'#ff8a3c'}" ${SW}/><path d="M${x},${y-8*s} C${x+6*s},${y} ${x+6*s},${y+8*s} ${x},${y+9*s} C${x-6*s},${y+8*s} ${x-6*s},${y+1*s} ${x},${y-8*s}Z" fill="${c2||'#ffe14d'}"/>`;}
function mirror(f){return f(1)+f(-1);}
function shade(h){return h;}/* 貼紙風：平塗上色 */

const SFX={warn:[[880,.12],[660,.12],[880,.12],[660,.16]],boom:[[160,.12],[110,.25]],hit:[[520,.05],[780,.07]],crit:[[600,.04],[900,.04],[1300,.12]],coin:[[1046,.05],[1568,.09]],bad:[[220,.12],[160,.2]],win:[[523,.11],[659,.11],[784,.11],[1047,.32]],lose:[[392,.15],[330,.15],[262,.3]],lvl:[[784,.08],[988,.08],[1175,.08],[1568,.26]],pet:[[880,.04],[660,.05]],kill:[[300,.05],[600,.05],[900,.12]],step:[[440,.03]],tick:[[700,.025]],skill:[[500,.06],[750,.06],[1000,.06],[1500,.16]],shield:[[700,.1],[900,.12]],heal:[[600,.08],[800,.16]],egg:[[300,.08],[450,.08],[700,.08],[1050,.3]]};
function sfx(n){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let t=AC.currentTime;
  (SFX[n]||[]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=(n==='bad'||n==='lose')?'sawtooth':'triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.09,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);t+=d*0.85;});}catch(e){}}
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Google|Jenny|Aria|Ava/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
try{if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}}catch(e){}
function speak(t){try{if(!('speechSynthesis' in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=S.rate||0.85;speechSynthesis.speak(u);}catch(e){}}

const KEY='eng-rpg-v2';
function blank(){return {v:2,profiles:[],cur:null,t:0,rate:0.85,mute:false};}
function load(){try{const j=localStorage.getItem(KEY);if(j){const s=JSON.parse(j);if(s&&Array.isArray(s.profiles))return s;}}catch(e){}return blank();}
let S=load();
function migrate(p){if(!p.vw)p.vw={};if(!p.vwrong)p.vwrong={};if(!p.vus)p.vus={};if(!p.vstars)p.vstars={};if(!p.look)p.look={hair:0,hc:0,sk:0};if(!p.story)p.story={intro:0,reg:{},boss:{}};if(!p.cnt)p.cnt={kill:{},curse:0,time:0,combo:0,cleared:0};if(!p.qdone)p.qdone={};if(!p.inv){p.inv=['w0-0','a0-0'];p.eq={w:'w0-0',a:'a0-0'};p.seenEq={'w0-0':1,'a0-0':1};}if(!p.eq)p.eq={w:null,a:null};if(!p.seenEq)p.seenEq={};Object.values(p.wrong||{}).forEach(w=>{if(w.due==null){w.due=dayNum();w.box=0;}});return p;}
S.profiles.forEach(migrate);
function obtain(p,id){p.inv.push(id);p.seenEq[id]=1;}
const HOST={on:false,tm:0,name:''};let dbRef=null,saveTimer=null,writing=false,pendingWrite=false,cloudOK=false;
const P=()=>S.profiles.find(p=>p.id===S.cur);
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(HOST.on){clearTimeout(HOST.tm);HOST.tm=setTimeout(()=>{try{parent.postMessage({source:'eng-rpg',type:'save',json:JSON.stringify(S),t:S.t},'*');}catch(e){}},1200);}if(dbRef){clearTimeout(saveTimer);saveTimer=setTimeout(flush,1500);}}
async function flush(){if(!dbRef)return;if(writing){pendingWrite=true;return;}writing=true;
  try{await dbRef.set({json:JSON.stringify(S),t:S.t});cloudOK=true;}catch(e){if(e&&e.code==='invalid_argument'){dbRef=null;cloudOK=false;}}
  writing=false;if(pendingWrite){pendingWrite=false;flush();}}
async function initCloud(){try{
  const db=await window.claude.use('db');const user=await window.claude.use('user');if(!db||!user)return;
  const id=await user.id();if(!id)return;const ref=db.doc('data/users/'+id+'/save2');
  const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
  dbRef=ref;cloudOK=true;const d=snap.exists?snap.data():null;
  if(d&&typeof d.json==='string'&&(d.t||0)>(S.t||0)){const s=JSON.parse(d.json);if(s&&Array.isArray(s.profiles)){S=s;S.profiles.forEach(migrate);try{localStorage.setItem(KEY,d.json);}catch(e){}if(!B){view=P()?'map':'title';}}}
  else if(S.profiles.length)flush();
  if(!B)render();
}catch(e){}}

function activePet(p){return p.pets[p.pet]||null;}
function dailyCheck(p){if(!p.daily||p.daily.d!==today()||!p.daily.qs){const seed=dayNum()*7+[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0),rng=mulberry32(seed);
  const pool=DAILY_POOL.filter(q=>q.id!=='rv'||Object.keys(p.wrong||{}).length>=3),qs=[];while(qs.length<3&&pool.length)qs.push(pool.splice(Math.floor(rng()*pool.length),1)[0].id);
  p.daily={d:today(),c:(p.daily&&p.daily.d===today()?p.daily.c:0)||0,k:0,s:0,cu:0,st3:0,cb:0,rv:0,qs,got:{},bonus:false};}}
function markPlayed(p){const t=today();if(p.last===t)return;p.streak=(p.last===yesterday())?(p.streak||0)+1:1;p.last=t;}
function randomEgg(p){const own=p.pets.map(x=>x.t);const left=EGG_PETS.filter(k=>!own.includes(k));return left.length?pick(left):null;}
function cleared(p,i){const n=NODES[i];return n.type==='unit'?(p.stars[n.u]||0)>0:!!p.boss[n.r];}
function maxOpen(p){let k=0;while(k<NODES.length-1&&(k<p.start||cleared(p,k)))k++;return k;}
const isMastered=(p,k)=>(p.ws[k]||0)>=2&&!p.wrong[k];

/* ---------- 地圖 ---------- */
const STEP=100,NH=NODES.length*STEP+170;
const nodeXY=i=>({x:Math.round(200+118*Math.sin(i*1.05)),y:NH-95-i*STEP});
function bandOf(ri){const a=regionStart(ri),b=(ri<REG.length-1?regionStart(ri+1):NODES.length)-1;
  const bottom=ri===0?NH:(nodeXY(a).y+nodeXY(a-1).y)/2,top=ri===REG.length-1?0:(nodeXY(b).y+nodeXY(b+1).y)/2;return {top,bottom};}
function mapSVG(p){const mo=maxOpen(p);let s=`<svg id="mapSvg" viewBox="0 0 400 ${NH}" role="img" aria-label="冒險地圖"><defs>`;
  REG.forEach((g,ri)=>{s+=`<linearGradient id="gb${ri}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${g.bg1}"/><stop offset="1" stop-color="${g.bg2}"/></linearGradient>`;});
  s+='</defs>';
  REG.forEach((g,ri)=>{const b=bandOf(ri);s+=`<rect x="0" y="${b.top}" width="400" height="${b.bottom-b.top}" fill="url(#gb${ri})"/>`;
    for(let k=0;k<9;k++){const seed=(ri*131+k*71)%997;const left=k%2===0;const x=left?16+(seed%36):350+(seed%34);const y=b.top+30+((seed*37)%Math.max(40,(b.bottom-b.top-60)));
      s+=`<text x="${x}" y="${y}" font-size="${22+(seed%12)}" opacity=".7" text-anchor="middle">${g.deco[k%g.deco.length]}</text>`;}});
  for(let i=0;i<NODES.length-1;i++){const a=nodeXY(i),b=nodeXY(i+1);
    s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#00000066" stroke-width="16" stroke-linecap="round"/>`;
    s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${i+1<=mo?'#ffe39a':'#ffffff30'}" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>`;}
  REG.forEach((g,ri)=>{const b=bandOf(ri);const yy=b.bottom-20;const done=p.boss[ri];
    s+=`<g transform="translate(200,${yy})"><rect x="-108" y="-15" width="216" height="30" rx="15" fill="${g.color}" stroke="#fff" stroke-width="2"/><text class="banner-t" text-anchor="middle" y="5">${g.icon} ${g.name}・${g.lv}${done?' 👑':''}</text></g>`;});
  NODES.forEach((n,i)=>{const {x,y}=nodeXY(i),g=REG[n.r],lk=i>mo,cl=cleared(p,i);
    s+=`<g class="nd ${lk?'lk':''}" transform="translate(${x},${y})" onclick="tapNode(${i})" role="button" aria-label="${n.type==='boss'?'魔王 '+g.boss[1]:'關卡 '+esc(UNITS[n.u].s)}">`;

    if(n.type==='boss'){s+=`<circle class="main" r="34" fill="${lk?'#2c3150':'#20122e'}" stroke="${lk?'#555c80':g.color}" stroke-width="5"/><g transform="translate(0,4) scale(.4)" ${lk?'opacity=".3"':''}><g filter="url(#stk)">${creatureInner(CSPEC['b'+n.r])}</g></g>`;
      if(cl)s+=`<text y="-30" font-size="22" text-anchor="middle">👑</text>`;
      s+=`<text class="nlabel" x="${x>200?-46:46}" y="5" text-anchor="${x>200?'end':'start'}">魔王 ${g.boss[1]}</text>`;}
    else{const u=UNITS[n.u],st=p.stars[u.id]||0;
      s+=`<circle class="main" r="24" fill="${lk?'#3a3f5c':cl?g.color:'#fff4cf'}" stroke="${lk?'#5a6188':'#fff'}" stroke-width="3"/><text class="nnum" text-anchor="middle" y="${lk?7:6}" ${lk?'font-size="16"':''}>${lk?'🔒':unitNo(i)}</text>`;
      if(!lk)s+=`<text y="42" text-anchor="middle" font-size="15">${[0,1,2].map(k=>`<tspan fill="${k<st?'#ffd35a':'#ffffff40'}">★</tspan>`).join('')}</text>`;
      const dn=lk?0:dueKeys(p,u.id).length;if(dn)s+=`<g transform="translate(19,-19)"><circle r="12" fill="#2a1240" stroke="#c79bff" stroke-width="2"/><text y="5" text-anchor="middle" font-size="13">👻</text></g>`;
      s+=`<text class="nlabel" x="${x>200?-34:34}" y="5" text-anchor="${x>200?'end':'start'}" ${lk?'opacity=".55"':''}>${esc(u.s)}${dn?' 👻'+dn:''}</text>`;}
    s+='</g>';});
  const h=nodeXY(Math.min(p.pos,NODES.length-1)),pet=activePet(p);
  s+=`<g id="heroG" transform="translate(${h.x},${h.y-38})" pointer-events="none"><g class="bob"><ellipse cx="0" cy="18" rx="18" ry="5" fill="#0007"/>${eqOf(p).a?`<ellipse cx="0" cy="17" rx="24" ry="8" fill="none" stroke="${TIERS[eqOf(p).a.t].c}" stroke-width="3" opacity=".9"/>`:''}<g transform="translate(0,-6) scale(.5)">${heroInner(heroOpts(p))}</g>${eqOf(p).w?`<text x="-26" y="18" font-size="22" text-anchor="middle" transform="rotate(-20 -26 10)">${eqOf(p).w.ic}</text>`:''}${pet?`<g transform="translate(30,6) scale(.3)">${creatureInner(CSPEC[specKey(pet.t,petStage(pet))]||CSPEC.ghost)}</g>`:''}</g></g>`;
  return s+'</svg>';}

  prog:{ic:'▶️',u:9,times:[['now','現在'],['right now','此刻']],ex:(v,s,a,tm)=>`「${tm[0]}」表示正在做，用 be 動詞 + V-ing：${a}。`},
  past:{ic:'⏪',u:15,times:[['yesterday','昨天'],['last night','昨晚'],['two days ago','兩天前'],['last Sunday','上星期天']],ex:(v,s,a,tm)=>`「${tm[0]}」是過去，用過去式：${v[0]} → ${a}。`},
  future:{ic:'⏩',u:16,times:[['tomorrow','明天'],['next week','下星期'],['this weekend','這個週末']],ex:(v,s,a,tm)=>`「${tm[0]}」是未來，用 will + 原形動詞：${a}。`},
  pastprog:{ic:'⏸️',u:17,times:[['at eight last night','昨晚八點那時'],['when you called','你打電話來的時候']],ex:(v,s,a,tm)=>`「${tm[0]}」是過去某個時間「正在做」，用 was / were + V-ing：${a}。`},
  perfect:{ic:'⏳',u:25,times:[['before','以前到現在的經驗'],['many times','到現在好幾次']],ex:(v,s,a,tm)=>`「${tm[0]}」說的是到現在為止的經驗，用 have / has + 過去分詞：${a}。`}
};
const TENSE_UNITS={9:['simple','prog'],15:['simple','prog','past'],16:['simple','prog','past','future'],17:['past','prog','pastprog','future'],25:['past','simple','perfect']};
const BOSS_TENSES=[null,['simple','prog'],['simple','prog','past'],['simple','prog','past','future','pastprog'],['simple','prog','past','future','pastprog'],['simple','prog','past','future','pastprog','perfect'],['simple','prog','past','future','pastprog','perfect'],['simple','prog','past','future','pastprog','perfect'],['simple','prog','past','future','pastprog','perfect']];
function genTime(tenses){const t=pick(tenses);const vs=t==='perfect'?VERBS.filter(v=>v[0]!=='go'):VERBS;const v=pick(vs),sj=pick(SUBJ),tm=pick(TENSE[t].times);const a=vform(v,t,sj[1]);
  const others=Object.keys(TENSE).filter(x=>x!==t);const pref=shuffle(others.filter(x=>tenses.includes(x))).concat(shuffle(others.filter(x=>!tenses.includes(x))));
  const errs=t==='simple'?[sj[1]===3?v[0]:v[1]]:t==='past'?[v[0]]:t==='prog'?[v[2]]:[];const w=[];
  for(const x of errs.concat(pref.map(x=>vform(v,x,sj[1])))){if(x!==a&&!w.includes(x))w.push(x);if(w.length===3)break;}
  return {gen:'time',tense:t,q:sj[0]+' ___ '+v[5]+'.',a,w,time:tm,full:sj[0]+' '+a+' '+v[5]+' '+tm[0]+'.',ex:TENSE[t].ex(v,sj,a,tm),u:TENSE[t].u,key:'t:'+t+':'+v[0]+':'+sj[0]};}

function canCurse(it){return !it.gen&&!isChoose(it)&&plain(fillS(it)).split(' ').length<=14;}
function makeCurse(it){for(const w of shuffle(it.w)){const c=curseWith(it,w);if(c)return c;}return null;}
function curseWith(it,wrong){const good=plain(fillS(it)).split(' '),bad=plain(it.q.replace('___',wrong)).split(' ');
  let s=0;while(s<good.length&&s<bad.length&&good[s]===bad[s])s++;let e=0;while(e<good.length-s&&e<bad.length-s&&good[good.length-1-e]===bad[bad.length-1-e])e++;
  const span=[];for(let i=s;i<bad.length-e;i++)span.push(i);if(!span.length)return null;
  return {it,type:'curse',tokens:bad,span,badSpan:bad.slice(s,bad.length-e).join(' '),goodSpan:good.slice(s,good.length-e).join(' '),hint:(it.q.match(/（(.*?)）/)||[])[1]||'',hidden:[],picked:[]};}
function orderQ(it){const words=plain(fillS(it)).split(' ');let tiles=shuffle(words.map(w=>({w,used:false})));if(tiles.map(t=>t.w).join(' ')===words.join(' '))tiles.reverse();return {it,type:'order',words,tiles,hidden:[],picked:[]};}
function phaseQ(){const tn=BOSS_TENSES[B.r];
  if(B.phase===3&&tn&&Math.random()<0.5){const it=genTime(tn);return {it,type:'mc',options:shuffle([it.a].concat(it.w)),hidden:[],picked:[]};}
  for(let k=0;k<10;k++){const it=pickItem();let q=null;
    if(B.phase===2&&canCurse(it))q=makeCurse(it);
    else if(B.phase===3)q=canOrder(it)?orderQ(it):canCurse(it)?makeCurse(it):null;
    if(q){B.seen.add(it.key);B.recent.push(it.key);if(B.recent.length>8)B.recent.shift();return q;}}
  return null;}
function makeQ(){if(B.voc)return makeVQ();if(B.kind==='boss'&&B.phase>1){const pq=phaseQ();if(pq)return pq;}let tenses=null;if(B.kind==='unit')tenses=TENSE_UNITS[B.unit];else if(B.kind==='boss')tenses=BOSS_TENSES[B.r];
  if(tenses&&Math.random()<(B.kind==='unit'?0.3:0.15)){const it=genTime(tenses);return {it,type:'mc',options:shuffle([it.a].concat(it.w)),hidden:[],picked:[]};}
  const it=pickItem();B.seen.add(it.key);B.recent.push(it.key);if(B.recent.length>8)B.recent.shift();
  const r=Math.random();if(canCurse(it)&&r<0.22){const c=makeCurse(it);if(c)return c;}
  const type=canOrder(it)&&r<0.44?'order':'mc';const q={it,type,hidden:[],picked:[]};
  if(type==='mc')q.options=shuffle([it.a].concat(it.w));
  else{q.words=plain(fillS(it)).split(' ');q.tiles=shuffle(q.words.map(w=>({w,used:false})));
    if(q.tiles.map(t=>t.w).join(' ')===q.words.join(' '))q.tiles.reverse();}
  return q;}

const M3={on:false,fail:false,built:false,userPan:false,labels:[],hero:{x:0,y:0.75,z:0},cz:0,gz:0,raf:0,tex:{}};
const NSTEP=7;
const TER=[{g:0x7ec850,h:0x5aa83c,amp:1.0,sky:0x8fd3ff},{g:0x3f8f4f,h:0x2a6a3a,amp:1.6,sky:0x7fc0c8},{g:0x56659a,h:0x8a9ae0,amp:2.6,sky:0x27315f},
 {g:0x9a8262,h:0xffffff,amp:6.5,sky:0xf2cf9a},{g:0x4d3230,h:0x241616,amp:4.2,sky:0x5c2218},{g:0x4a3a6e,h:0x2a2046,amp:2.0,sky:0x1b1133},
 {g:0xbcd8f2,h:0xeef6ff,amp:1.8,sky:0x72b8ff},{g:0x2c3170,h:0x7566d8,amp:2.3,sky:0x0d0d2c},{g:0x2f7c72,h:0xd9a441,amp:2.4,sky:0x103c3c}];
const WATER=[0x3a9fe0,0x2f8fb0,0x1f3f7a,0x4a9ad0,0xff5a1a,0x2a1a4a,0xf4faff,0x1a1a4a,0x0f5a5a];
function n3x(i){return Math.sin(i*0.85)*8+Math.sin(i*0.31+1)*4;}
function fIdx(z){return Math.max(0,Math.min(NODES.length-1,-z/NSTEP));}
function pathX(z){const f=fIdx(z),i=Math.floor(f),t=f-i,a=n3x(i),b=n3x(Math.min(NODES.length-1,i+1)),e=t*t*(3-2*t);return a+(b-a)*e;}
function regBlend(z){const f=fIdx(z),i=Math.floor(f),j=Math.min(NODES.length-1,i+1);return [NODES[i].r,NODES[j].r,f-i];}
function tnoise(x,z){return Math.sin(x*0.31+z*0.17)*0.5+Math.sin(x*0.13-z*0.29+1.7)*0.6+Math.sin(x*0.57+z*0.43+0.6)*0.25+Math.sin(z*0.08+x*0.05)*0.7;}
function hAt(x,z){const rb=regBlend(z),amp=TER[rb[0]].amp+(TER[rb[1]].amp-TER[rb[0]].amp)*rb[2],d=Math.abs(x-pathX(z)),k=Math.min(1,Math.max(0,(d-3)/9)),ks=k*k*(3-2*k);
  let h=0.25+ks*(0.5+(tnoise(x,z)+1.3)*amp*0.6);const e=Math.abs(x)-30;if(e>0)h-=e*e*0.06;
  const L=(NODES.length-1)*NSTEP,ze=z>5?z-5:z<-L-8?-L-8-z:0;if(ze>0)h-=ze*ze*0.08;return h;}
function m3Build(){const T=THREE,scene=new T.Scene();M3.scene=scene;scene.fog=new T.Fog(0x8fd3ff,48,125);scene.background=new T.Color(0x8fd3ff);
  M3.rn=new T.WebGLRenderer({antialias:true});M3.rn.setPixelRatio(Math.min(2,window.devicePixelRatio||1));M3.cv=M3.rn.domElement;
  M3.cam=new T.PerspectiveCamera(42,1,0.5,160);
  scene.add(new T.HemisphereLight(0xffffff,0x4a5a7a,0.78));const dl=new T.DirectionalLight(0xfff4e0,0.5);dl.position.set(12,24,14);scene.add(dl);
  const L=(NODES.length-1)*NSTEP,c=new T.Color(),c2=new T.Color(),c3=new T.Color();
  /* 地形 */
  const geo=new T.PlaneGeometry(88,L+40,48,Math.round((L+40)/1.6));geo.rotateX(-Math.PI/2);geo.translate(0,0,-L/2);
  const pos=geo.attributes.position,col=new Float32Array(pos.count*3);
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),y=hAt(x,z);pos.setY(i,y);const rb=regBlend(z),ga=TER[rb[0]],gb=TER[rb[1]],t=rb[2];
    c.setHex(ga.g).lerp(c2.setHex(gb.g),t);const amp=ga.amp+(gb.amp-ga.amp)*t,hk=Math.min(1,Math.max(0,(y-1.5)/(amp*2.2)));
    c3.setHex(ga.h).lerp(c2.setHex(gb.h),t);c.lerp(c3,hk);
    const d=Math.abs(x-pathX(z));if(d<2.8)c.lerp(c2.setHex(0xe6d3a0),d<1.5?0.85:0.4);
    if(y<0.05)c.lerp(c2.setHex(0xd8c890),0.5);

  geo.setAttribute('color',new T.BufferAttribute(col,3));geo.computeVertexNormals();

  for(let i=0;i<wp.count;i++){const rb=regBlend(wp.getZ(i));c.setHex(WATER[rb[0]]).lerp(c2.setHex(WATER[rb[1]]),rb[2]);wcl[i*3]=c.r;wcl[i*3+1]=c.g;wcl[i*3+2]=c.b;}
  wg.setAttribute('color',new T.BufferAttribute(wcl,3));scene.add(new T.Mesh(wg,new T.MeshBasicMaterial({vertexColors:true})));
  /* 裝飾 */
  const mat=(color,em)=>new T.MeshPhongMaterial({color,flatShading:true,shininess:0,emissive:em||0});
  const G={trunk:new T.CylinderGeometry(0.22,0.32,1.2,5),leaf:new T.IcosahedronGeometry(1.15,0),pine:new T.ConeGeometry(1.05,2.6,6),pine2:new T.ConeGeometry(0.75,1.9,6),rock:new T.DodecahedronGeometry(0.8,0),
    crystal:new T.OctahedronGeometry(0.6,0),stem:new T.CylinderGeometry(0.22,0.28,0.7,6),cap:new T.SphereGeometry(0.65,7,4,0,6.283,0,1.571),flower:new T.SphereGeometry(0.22,5,4),cloud:new T.IcosahedronGeometry(1.6,1),
    pillar:new T.CylinderGeometry(0.5,0.6,4.5,7),gear:new T.TorusGeometry(1.3,0.38,5,9)};
  const D={};const add=(k,x,y,z,s,sy,r)=>{(D[k]=D[k]||[]).push({x,y,z,s:s||1,sy:sy||s||1,r:r||0});};
  const rng=mulberry32(20261115);
  const tree=(x,y,z,s,leafK)=>{add('trunk',x,y+0.6*s,z,s);add(leafK,x,y+1.9*s,z,s,s,rng()*6);};
  const pine=(x,y,z,s,k)=>{add('trunk',x,y+0.5*s,z,s);add(k||'pine',x,y+2.1*s,z,s);add((k||'pine')+'2',x,y+3.3*s,z,s);};
  REG.forEach((g,r)=>{const a=regionStart(r),b=r<REG.length-1?regionStart(r+1)-1:NODES.length-1,z0=-a*NSTEP+3,z1=-b*NSTEP-3,n=Math.round((z0-z1)*2.6);
    for(let k=0;k<n;k++){const x=(rng()*2-1)*34,z=z1+rng()*(z0-z1),d=Math.abs(x-pathX(z)),y=hAt(x,z),u=rng(),s=0.75+rng()*0.7;

      else if(r===3){if(u<0.35&&y<5)pine(x,y,z,s);else if(u<0.7)add('rock',x,y+0.4,z,s*1.2);}

      else{if(u<0.45)add('gear',x,y+1.3*s,z,s,s,rng()*3);else if(u<0.75)add('crysT',x,y+0.7,z,s,s*2,rng()*3);else add('rock',x,y+0.4,z,s);}}});
  const defs={trunk:[G.trunk,mat(0x8a5a34)],trunkD:[G.trunk,mat(0x2a2030)],leaf0:[G.leaf,mat(0x4fb04a)],leaf6:[G.leaf,mat(0xffb8d8)],pine:[G.pine,mat(0x2f7a45)],pine2:[G.pine2,mat(0x3a8f55)],
    rock:[G.rock,mat(0x8a8f9c)],rockD:[G.rock,mat(0x2c2428)],crysB:[G.crystal,mat(0x7ad0ff,0x2a6aa0)],crysO:[G.crystal,mat(0xff8a2c,0xb03a00)],crysP:[G.crystal,mat(0xb77cff,0x5a2aa0)],crysT:[G.crystal,mat(0x5fe0c0,0x1a7a60)],

function m3Tex(key,inner,cb){if(M3.tex[key]){cb(M3.tex[key]);return;}

function m3ClampZ(z){return Math.max(-(NODES.length-1)*NSTEP-4,Math.min(4,z));}

function walk3d(i,done){const p=P(),H=M3.hero;let cur=p.pos;const dir=i>cur?1:-1,far=Math.abs(i-cur),dur=reduced()?1:far>8?110:230;M3.userPan=false;
